<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110E">
<title>O Último Relógio</title>
<style>
  :root {
    --breu:  #14110E;
    --latao: #B08A4A;
    --osso:  #E4DCC8;
    --ambar: #E8A33D;
    --ferrugem: #8C3B2A;
    --patina: #4E6B5C;
    /* Escala do palco (720x1280 lógico -> tela). Definida por main.js. */
    --ui: 1;
  }

  /* O `display` de uma regra nossa vence o display:none que o navegador dá ao
     atributo hidden. Sem isto, #gameover fica visível a partida inteira. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--breu);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--osso);
  }

  /* Palco = retângulo com letterbox. Canvas e HUD compartilham o mesmo rect. */
  #stage {
    position: relative;
    overflow: hidden;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* HUD é DOM por cima do canvas, nunca texto desenhado por frame. */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* --- HUD do jogo. Texto é DOM e só muda quando o valor muda. --- */

  #topbar {
    position: absolute;
    top:   calc(28px * var(--ui));
    left:  calc(34px * var(--ui));
    right: calc(34px * var(--ui));
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(24px * var(--ui));
  }

  .label {
    font-size: calc(13px * var(--ui));
    letter-spacing: calc(2px * var(--ui));
    color: var(--latao);
    opacity: 0.7;
  }

  #wind-wrap { flex: 1; max-width: calc(380px * var(--ui)); }

  #wind-track {
    margin-top: calc(7px * var(--ui));
    height: calc(10px * var(--ui));
    background: rgba(176, 138, 74, 0.16);
    border: 1px solid rgba(176, 138, 74, 0.4);
    border-radius: calc(5px * var(--ui));
    overflow: hidden;
  }

  #wind-fill {
    height: 100%;
    width: 100%;
    background: var(--latao);
    transition: width 120ms linear;
  }

  /* A corda baixa é o único alarme do HUD. */
  #wind-fill.baixa { background: var(--ferrugem); }

  #wind-num {
    margin-top: calc(5px * var(--ui));
    font-size: calc(26px * var(--ui));
    font-variant-numeric: tabular-nums;
    color: var(--osso);
  }

  #stats {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: calc(10px * var(--ui));
  }

  #stats .valor {
    display: block;
    margin-top: calc(2px * var(--ui));
    font-size: calc(22px * var(--ui));
    font-variant-numeric: tabular-nums;
    color: var(--osso);
  }

  /* Telas cheias: loja, menu e fim de jogo dividem a mesma base. */
  #shop, #menu, #gameover {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(14px * var(--ui));
    background: rgba(20, 17, 14, 0.94);
    pointer-events: auto;
    text-align: center;
  }

  #shop { justify-content: space-between; padding: calc(60px * var(--ui)) calc(26px * var(--ui)); }
  .tela-topo, .tela-baixo { display: flex; flex-direction: column; align-items: center; gap: calc(10px * var(--ui)); width: 100%; }

  #shop h2, .titulo {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
    color: var(--osso);
  }
  #shop h2 { font-size: calc(32px * var(--ui)); }
  .titulo { font-size: calc(50px * var(--ui)); }

  #shop-bonus, #menu-sub { margin: 0; font-size: calc(17px * var(--ui)); color: var(--latao); }

  #shop-cartas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: calc(12px * var(--ui));
    width: 100%;
  }

  .oferta {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(6px * var(--ui));
    padding: calc(16px * var(--ui)) calc(10px * var(--ui));
    min-height: calc(112px * var(--ui));
    font: inherit;
    color: var(--osso);
    background: rgba(35, 29, 22, 0.95);
    border: 1px solid rgba(176, 138, 74, 0.5);
    border-radius: calc(5px * var(--ui));
    cursor: pointer;
  }
  .oferta .ot { font-size: calc(19px * var(--ui)); }
  .oferta .od { font-size: calc(13px * var(--ui)); color: var(--latao); }
  .oferta .oc { font-size: calc(17px * var(--ui)); color: var(--ambar); font-variant-numeric: tabular-nums; }
  .oferta[disabled] { opacity: 0.35; cursor: default; }
  .oferta.comprada { opacity: 0.4; border-color: var(--patina); }

  #shop-reroll {
    padding: calc(12px * var(--ui)) calc(22px * var(--ui));
    min-height: calc(46px * var(--ui));
    font: inherit;
    font-size: calc(15px * var(--ui));
    color: var(--osso);
    background: transparent;
    border: 1px solid rgba(176, 138, 74, 0.5);
    border-radius: calc(4px * var(--ui));
    cursor: pointer;
  }
  #shop-reroll[disabled] { opacity: 0.35; cursor: default; }

  .grande {
    padding: calc(17px * var(--ui)) calc(46px * var(--ui));
    min-height: calc(52px * var(--ui));
    font: inherit;
    font-size: calc(22px * var(--ui));
    letter-spacing: calc(1px * var(--ui));
    color: var(--breu);
    background: var(--latao);
    border: 0;
    border-radius: calc(4px * var(--ui));
    cursor: pointer;
  }

  #gameover h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: calc(44px * var(--ui));
    color: var(--osso);
  }

  #gameover p {
    margin: 0;
    font-size: calc(19px * var(--ui));
    color: var(--latao);
  }

  #restart {
    margin-top: calc(16px * var(--ui));
    padding: calc(15px * var(--ui)) calc(38px * var(--ui));
    min-height: calc(48px * var(--ui));
    font: inherit;
    font-size: calc(20px * var(--ui));
    letter-spacing: calc(1px * var(--ui));
    color: var(--breu);
    background: var(--latao);
    border: 0;
    border-radius: calc(4px * var(--ui));
    cursor: pointer;
  }

  #restart:focus-visible { outline: calc(3px * var(--ui)) solid var(--ambar); outline-offset: calc(3px * var(--ui)); }

  /* --- Painel de peças, na base: é onde o polegar alcança. --- */

  #panel {
    position: absolute;
    left:   calc(16px * var(--ui));
    right:  calc(16px * var(--ui));
    bottom: calc(24px * var(--ui));
    display: flex;
    gap: calc(8px * var(--ui));
    pointer-events: auto;
  }

  .carta {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(4px * var(--ui));
    padding: calc(10px * var(--ui)) calc(4px * var(--ui));
    min-height: calc(96px * var(--ui));
    font: inherit;
    color: var(--osso);
    background: rgba(30, 25, 19, 0.9);
    border: 1px solid rgba(176, 138, 74, 0.45);
    border-radius: calc(5px * var(--ui));
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .carta svg {
    width:  calc(30px * var(--ui));
    height: calc(30px * var(--ui));
    stroke: var(--latao);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .carta .nome {
    font-size: calc(12px * var(--ui));
    letter-spacing: calc(0.5px * var(--ui));
  }

  .carta .custo {
    font-size: calc(14px * var(--ui));
    font-variant-numeric: tabular-nums;
    color: var(--latao);
  }

  /* Sem saldo: a carta apaga e para de aceitar arrasto. */
  .carta[disabled] { opacity: 0.35; cursor: default; }
  /* Tipo ainda não liberado pela loja: some o preço e apaga mais. */
  .carta.travada { opacity: 0.22; border-style: dashed; }
  .carta.arrastando { border-color: var(--ambar); }

  /* --- Popover de peça colocada --- */

  #popover {
    position: absolute;
    z-index: 2;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    gap: calc(8px * var(--ui));
    padding: calc(10px * var(--ui)) calc(12px * var(--ui));
    background: rgba(24, 20, 15, 0.96);
    border: 1px solid rgba(176, 138, 74, 0.5);
    border-radius: calc(5px * var(--ui));
    pointer-events: auto;
    white-space: nowrap;
  }

  #pop-titulo {
    font-size: calc(14px * var(--ui));
    color: var(--osso);
    text-align: center;
  }

  #popover .acoes { display: flex; gap: calc(8px * var(--ui)); }

  #popover button {
    padding: calc(11px * var(--ui)) calc(14px * var(--ui));
    min-height: calc(44px * var(--ui));
    font: inherit;
    font-size: calc(14px * var(--ui));
    color: var(--breu);
    background: var(--latao);
    border: 0;
    border-radius: calc(4px * var(--ui));
    cursor: pointer;
  }

  #popover button[disabled] { opacity: 0.4; cursor: default; }
  #pop-vender { background: var(--patina); color: var(--osso); }

  /* Overlay de debug (F1, ou 3 dedos no celular). Ferramenta de trabalho,
     mantida até o fim do projeto — ver CLAUDE.md. */
  #debug {
    position: absolute;
    top:  calc(150px * var(--ui));
    left: calc(14px * var(--ui));
    margin: 0;
    padding: calc(8px * var(--ui)) calc(10px * var(--ui));
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: calc(13px * var(--ui));
    line-height: 1.45;
    white-space: pre;
    color: var(--osso);
    background: rgba(10, 8, 6, 0.72);
    border: 1px solid rgba(176, 138, 74, 0.35);
    border-radius: calc(3px * var(--ui));
  }

  /* Acima do painel de peças, não em cima dele. */
  #fps {
    position: absolute;
    bottom: calc(132px * var(--ui));
    right:  calc(18px * var(--ui));
    font-size: calc(18px * var(--ui));
    font-variant-numeric: tabular-nums;
    letter-spacing: calc(1px * var(--ui));
    color: var(--latao);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="topbar">
        <div id="wind-wrap">
          <div class="label">CORDA</div>
          <div id="wind-track"><div id="wind-fill"></div></div>
          <div id="wind-num">100</div>
        </div>
        <div id="stats">
          <div><span class="label">HORA</span><span class="valor" id="hour">1/6</span></div>
          <div><span class="label">ENGRENAGENS</span><span class="valor" id="gears">0</span></div>
        </div>
      </div>

      <div id="panel">
        <button class="carta" type="button" data-type="hammer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h9v5H5z"/><path d="M9.5 13v7"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
        <button class="carta" type="button" data-type="bell">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17c0-6 1-9 6-9s6 3 6 9z"/><path d="M4 17h16"/><path d="M12 20a1.6 1.6 0 0 0 1.6-1.6h-3.2A1.6 1.6 0 0 0 12 20z"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
        <button class="carta" type="button" data-type="spring">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12"/><path d="M6 19h12"/><path d="M7 7h10l-10 4h10l-10 4h10"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
        <button class="carta" type="button" data-type="hourglass">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12"/><path d="M6 20h12"/><path d="M7 4c0 4 5 6 5 8s-5 4-5 8"/><path d="M17 4c0 4-5 6-5 8s5 4 5 8"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
        <button class="carta" type="button" data-type="chain">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="8" height="8" rx="4"/><rect x="12" y="8" width="8" height="8" rx="4"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
        <button class="carta" type="button" data-type="counterweight">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5"/><path d="M8 8h8l2 12H6z"/></svg>
          <span class="nome"></span>
          <span class="custo"></span>
        </button>
      </div>

      <div id="popover" hidden>
        <div id="pop-titulo"></div>
        <div class="acoes">
          <button id="pop-melhorar" type="button"></button>
          <button id="pop-vender" type="button"></button>
        </div>
      </div>

      <!-- Loja da virada de hora, e as telas de menu e fim. -->
      <div id="shop" hidden>
        <div class="tela-topo">
          <h2 id="shop-hora"></h2>
          <p id="shop-bonus"></p>
        </div>
        <div id="shop-cartas"></div>
        <div class="tela-baixo">
          <button id="shop-reroll" type="button"></button>
          <button id="shop-seguir" class="grande" type="button">Dar corda</button>
        </div>
      </div>

      <div id="menu" hidden>
        <h1 class="titulo">O Último Relógio</h1>
        <p id="menu-sub">Seis horas. Meia-noite é o fim.</p>
        <button id="menu-jogar" class="grande" type="button">Dar corda</button>
      </div>

      <div id="gameover" hidden>
        <h1>A corda parou</h1>
        <p id="go-linha1"></p>
        <p id="go-linha2"></p>
        <button id="restart" type="button">Dar corda</button>
      </div>

      <div id="fps">--</div>
      <pre id="debug" hidden></pre>
    </div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>

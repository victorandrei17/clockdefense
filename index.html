<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110E">
<title>O Último Relógio</title>
<style>
  :root {
    --breu:  #14110E;
    --latao: #B08A4A;
    --osso:  #E4DCC8;
    /* Escala do palco (720x1280 lógico -> tela). Definida por main.js. */
    --ui: 1;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--breu);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--osso);
  }

  /* Palco = retângulo com letterbox. Canvas e HUD compartilham o mesmo rect. */
  #stage {
    position: relative;
    overflow: hidden;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* HUD é DOM por cima do canvas, nunca texto desenhado por frame. */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #fps {
    position: absolute;
    top:   calc(10px * var(--ui));
    right: calc(14px * var(--ui));
    font-size: calc(18px * var(--ui));
    font-variant-numeric: tabular-nums;
    letter-spacing: calc(1px * var(--ui));
    color: var(--latao);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="fps">--</div>
    </div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>

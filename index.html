<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110E">
<title>O Último Relógio</title>
<style>
  :root {
    --breu:  #14110E;
    --latao: #B08A4A;
    --osso:  #E4DCC8;
    --ambar: #E8A33D;
    --ferrugem: #8C3B2A;
    /* Escala do palco (720x1280 lógico -> tela). Definida por main.js. */
    --ui: 1;
  }

  /* O `display` de uma regra nossa vence o display:none que o navegador dá ao
     atributo hidden. Sem isto, #gameover fica visível a partida inteira. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--breu);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--osso);
  }

  /* Palco = retângulo com letterbox. Canvas e HUD compartilham o mesmo rect. */
  #stage {
    position: relative;
    overflow: hidden;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* HUD é DOM por cima do canvas, nunca texto desenhado por frame. */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* --- HUD do jogo. Texto é DOM e só muda quando o valor muda. --- */

  #topbar {
    position: absolute;
    top:   calc(28px * var(--ui));
    left:  calc(34px * var(--ui));
    right: calc(34px * var(--ui));
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(24px * var(--ui));
  }

  .label {
    font-size: calc(13px * var(--ui));
    letter-spacing: calc(2px * var(--ui));
    color: var(--latao);
    opacity: 0.7;
  }

  #wind-wrap { flex: 1; max-width: calc(380px * var(--ui)); }

  #wind-track {
    margin-top: calc(7px * var(--ui));
    height: calc(10px * var(--ui));
    background: rgba(176, 138, 74, 0.16);
    border: 1px solid rgba(176, 138, 74, 0.4);
    border-radius: calc(5px * var(--ui));
    overflow: hidden;
  }

  #wind-fill {
    height: 100%;
    width: 100%;
    background: var(--latao);
    transition: width 120ms linear;
  }

  /* A corda baixa é o único alarme do HUD. */
  #wind-fill.baixa { background: var(--ferrugem); }

  #wind-num {
    margin-top: calc(5px * var(--ui));
    font-size: calc(26px * var(--ui));
    font-variant-numeric: tabular-nums;
    color: var(--osso);
  }

  #stats {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: calc(10px * var(--ui));
  }

  #stats .valor {
    display: block;
    margin-top: calc(2px * var(--ui));
    font-size: calc(22px * var(--ui));
    font-variant-numeric: tabular-nums;
    color: var(--osso);
  }

  #gameover {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(14px * var(--ui));
    background: rgba(20, 17, 14, 0.88);
    pointer-events: auto;
    text-align: center;
  }

  #gameover h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: calc(44px * var(--ui));
    color: var(--osso);
  }

  #gameover p {
    margin: 0;
    font-size: calc(19px * var(--ui));
    color: var(--latao);
  }

  #restart {
    margin-top: calc(16px * var(--ui));
    padding: calc(15px * var(--ui)) calc(38px * var(--ui));
    min-height: calc(48px * var(--ui));
    font: inherit;
    font-size: calc(20px * var(--ui));
    letter-spacing: calc(1px * var(--ui));
    color: var(--breu);
    background: var(--latao);
    border: 0;
    border-radius: calc(4px * var(--ui));
    cursor: pointer;
  }

  #restart:focus-visible { outline: calc(3px * var(--ui)) solid var(--ambar); outline-offset: calc(3px * var(--ui)); }

  /* Overlay de debug (F1, ou 3 dedos no celular). Ferramenta de trabalho,
     mantida até o fim do projeto — ver CLAUDE.md. */
  #debug {
    position: absolute;
    top:  calc(150px * var(--ui));
    left: calc(14px * var(--ui));
    margin: 0;
    padding: calc(8px * var(--ui)) calc(10px * var(--ui));
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: calc(13px * var(--ui));
    line-height: 1.45;
    white-space: pre;
    color: var(--osso);
    background: rgba(10, 8, 6, 0.72);
    border: 1px solid rgba(176, 138, 74, 0.35);
    border-radius: calc(3px * var(--ui));
  }

  #fps {
    position: absolute;
    bottom: calc(10px * var(--ui));
    right:  calc(14px * var(--ui));
    font-size: calc(18px * var(--ui));
    font-variant-numeric: tabular-nums;
    letter-spacing: calc(1px * var(--ui));
    color: var(--latao);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="topbar">
        <div id="wind-wrap">
          <div class="label">CORDA</div>
          <div id="wind-track"><div id="wind-fill"></div></div>
          <div id="wind-num">100</div>
        </div>
        <div id="stats">
          <div><span class="label">HORA</span><span class="valor" id="hour">1/6</span></div>
          <div><span class="label">ENGRENAGENS</span><span class="valor" id="gears">0</span></div>
        </div>
      </div>

      <div id="gameover" hidden>
        <h1>A corda parou</h1>
        <p id="go-linha1"></p>
        <p id="go-linha2"></p>
        <button id="restart" type="button">Dar corda</button>
      </div>

      <div id="fps">--</div>
      <pre id="debug" hidden></pre>
    </div>
  </div>
  <script src="./bundle.js"></script>
</body>
</html>
